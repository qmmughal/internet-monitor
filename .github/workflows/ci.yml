name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Python core: parsers, diagnostics, CLI, local API ────────
  python:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke test (legacy entry point)
        run: |
          python cli/wifi-monitor.py --help
          python -m wifi_monitor capabilities --json
          python -m wifi_monitor scan --demo --json
      - name: CLI works without rich
        run: |
          python -m pip uninstall -y rich
          python -m wifi_monitor status --demo
      - name: Optional integrations import
        if: matrix.python == '3.12'
        run: |
          python -m pip install ".[ai,mqtt]"
          python -m pytest -q tests/python/test_ai.py tests/python/test_hub_mqtt_metrics.py

  # ── Dashboard unit tests (no dependencies) ───────────────────
  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: for f in src/js/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test

  # ── HTML validation ──────────────────────────────────────────
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes html-validate@8 src/index.html
